name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural validator
        run: python3 test/validate.py
      - name: The plant guard itself (content AND mode, and the incident that named it)
        run: python3 test/plant_guard_test.py

      - name: Negative self-test (validator must be able to fail)
        run: |
          set -eu
          rm -rf /tmp/corrupt-copy
          cp -R . /tmp/corrupt-copy
          python3 test/plant_guard.py snap /tmp/corrupt-copy
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/corrupt-copy/plugins/make-skill/.claude-plugin/plugin.json")
          p.write_text(re.sub(r'"version": "[0-9.]*"', '"version": "0.0.0-corrupt"',
                              p.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          # A plant that edits nothing leaves the validator honestly passing, and the step
          # then blames a guard it never disarmed. Instruction #6's corollary: verify the
          # file actually changed before believing the result.
          python3 test/plant_guard.py verify /tmp/corrupt-copy "Negative self-test (validator must be able to fail)"
          if python3 /tmp/corrupt-copy/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy — it cannot fail"
            exit 1
          else
            echo "OK: validator correctly FAILs on corrupted copy"
          fi

      - name: Negative self-test (missing template must fail)
        run: |
          set -eu
          rm -rf /tmp/notmpl-copy
          cp -R . /tmp/notmpl-copy
          rm -f /tmp/notmpl-copy/plugins/make-skill/skills/make-skill/assets/SKILL.template.md
          if python3 /tmp/notmpl-copy/test/validate.py; then
            echo "ERROR: validator passed with assets/SKILL.template.md missing"
            exit 1
          else
            echo "OK: validator requires the template skeleton"
          fi

      - name: Negative self-test (Russian-free description must fail)
        run: |
          set -eu
          rm -rf /tmp/noru-copy
          cp -R . /tmp/noru-copy
          python3 test/plant_guard.py snap /tmp/noru-copy
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("/tmp/noru-copy/plugins/make-skill/skills/make-skill/SKILL.md")
          p.write_text(re.sub(r"[а-яё]", "x", p.read_text(encoding="utf-8"), flags=re.I), encoding="utf-8")
          PY
          # A plant that edits nothing leaves the validator honestly passing, and the step
          # then blames a guard it never disarmed. Instruction #6's corollary: verify the
          # file actually changed before believing the result.
          python3 test/plant_guard.py verify /tmp/noru-copy "Negative self-test (Russian-free description must fail)"
          if python3 /tmp/noru-copy/test/validate.py; then
            echo "ERROR: validator passed with no Russian trigger aliases"
            exit 1
          else
            echo "OK: validator requires Russian trigger aliases"
          fi

      - name: Negative self-test (spec violations must fail)
        run: |
          set -eu
          for case in name desc key ref trigger contrib; do
            rm -rf "/tmp/spec-$case"
            cp -R . "/tmp/spec-$case"
            python3 test/plant_guard.py snap "/tmp/spec-$case"
            CASE="$case" python3 - <<'PY'
          import os, pathlib, re
          case = os.environ["CASE"]
          root = pathlib.Path(f"/tmp/spec-{case}")
          skill = root / "plugins/make-skill/skills/make-skill/SKILL.md"
          t = skill.read_text(encoding="utf-8")
          if case == "name":      # spec charset: no uppercase, no double hyphen
              t = re.sub(r"^name: make-skill$", "name: Make--Skill", t, count=1, flags=re.M)
          elif case == "desc":    # spec: description <= 1024 chars
              t = re.sub(r"^description: ", "description: " + "x" * 1100 + " ", t, count=1, flags=re.M)
          elif case == "key":     # spec: no front-matter keys outside the standard
              t = re.sub(r"^name: make-skill$", "name: make-skill\nauthor: nope", t, count=1, flags=re.M)
          skill.write_text(t, encoding="utf-8")
          if case == "ref":       # unreachable reference file = dead context
              (root / "plugins/make-skill/skills/make-skill/references/orphan.md").write_text("# orphan\n")
          if case == "trigger":   # a reference without a stated load condition
              r = root / "plugins/make-skill/skills/make-skill/references/mcp.md"
              r.write_text(r.read_text(encoding="utf-8").replace("Load this when", "About", 1), encoding="utf-8")
          if case == "contrib":   # public repo must keep its contributor entry points
              (root / "CONTRIBUTING.md").unlink()
          PY
            python3 test/plant_guard.py verify "/tmp/spec-$case" "Negative self-test (spec violations must fail)"
            if python3 "/tmp/spec-$case/test/validate.py"; then
              echo "ERROR: validator passed on spec violation '$case'"; exit 1
            fi
            echo "OK: validator rejects spec violation '$case'"
          done

      - name: Negative self-test (Anthropic platform rules must fail)
        run: |
          set -eu
          # Rules the open standard is silent about and only the Skills API
          # enforces — i.e. on someone else's machine — plus the two budgets a
          # house validator is the only place to check.
          for case in reserved:'reserved word' xmltag:'XML tag' person:'third person' \
                      toc:'Contents' tokens:'tokens' tplxml:'angle brackets'; do
            name="${case%%:*}"; expect="${case#*:}"
            rm -rf "/tmp/ap-$name"
            cp -R . "/tmp/ap-$name"
            python3 test/plant_guard.py snap "/tmp/ap-$name"
            CASE="$name" python3 - <<'PY'
          import os, pathlib, re
          case = os.environ["CASE"]
          root = pathlib.Path(f"/tmp/ap-{case}")
          skill = root / "plugins/make-skill/skills/make-skill/SKILL.md"
          t = skill.read_text(encoding="utf-8")
          if case == "reserved":    # "anthropic"/"claude" in name → rejected on upload
              t = re.sub(r"^name: make-skill$", "name: make-claude-skill", t, count=1, flags=re.M)
          elif case == "xmltag":    # angle brackets in description → rejected on upload
              t = re.sub(r"^description: Use when ", "description: Use when <trigger> ", t, count=1, flags=re.M)
          elif case == "person":    # first/second person degrades skill selection
              t = re.sub(r"^(description: .*)$", r"\1 I can help you ship skills.", t, count=1, flags=re.M)
          elif case == "tokens":    # body budget: < 5000 tokens
              t += "\n" + ("padding text that costs tokens. " * 400) + "\n"
          skill.write_text(t, encoding="utf-8")
          if case == "toc":         # a long reference with no table of contents
              r = root / "plugins/make-skill/skills/make-skill/references/surfaces.md"
              r.write_text(r.read_text(encoding="utf-8").replace("## Contents", "## Sections", 1), encoding="utf-8")
          if case == "tplxml":      # a skeleton that seeds an invalid skill
              p = root / "plugins/make-skill/skills/make-skill/assets/SKILL.template.md"
              p.write_text(p.read_text(encoding="utf-8").replace(
                  "name: skill-name-here", "name: <skill-name>", 1), encoding="utf-8")
          PY
            python3 test/plant_guard.py verify "/tmp/ap-$name" "Negative self-test (Anthropic platform rules must fail)"
            if out=$(python3 "/tmp/ap-$name/test/validate.py" 2>&1); then
              echo "ERROR: validator passed on platform violation '$name'"; exit 1
            fi
            if ! echo "$out" | grep -qi -- "$expect"; then
              echo "ERROR: '$name' failed for the wrong reason (no '$expect'):"
              echo "$out"; exit 1
            fi
            echo "OK: validator rejects '$name' with the right message"
          done

      - name: Negative self-test (evaluation suite must stay real)
        run: |
          set -eu
          # Evaluations are data a human runs, so nothing else proves they exist
          # or that the near-miss negatives survived an edit.
          for case in evalneg:'negative' evalfew:'scenarios' evalfile:'missing file' \
                      evalsplit:'both classes'; do
            name="${case%%:*}"; expect="${case#*:}"
            rm -rf "/tmp/ev-$name"
            cp -R . "/tmp/ev-$name"
            python3 test/plant_guard.py snap "/tmp/ev-$name"
            CASE="$name" python3 - <<'PY'
          import json, os, pathlib
          case = os.environ["CASE"]
          root = pathlib.Path(f"/tmp/ev-{case}")
          trig_p, scen_p = root / "test/evals/triggers.json", root / "test/evals/scenarios.json"
          if case == "evalneg":     # a trigger set with no near-misses proves nothing
              t = json.loads(trig_p.read_text(encoding="utf-8"))
              t["queries"] = [q for q in t["queries"] if q["should_trigger"]]
              trig_p.write_text(json.dumps(t, indent=2), encoding="utf-8")
          elif case == "evalsplit": # every positive in train = validation measures one thing
              t = json.loads(trig_p.read_text(encoding="utf-8"))
              pos = [q["id"] for q in t["queries"] if q["should_trigger"]]
              neg = [q["id"] for q in t["queries"] if not q["should_trigger"]]
              t["split"]["train"] = pos + neg[:2]
              t["split"]["validation"] = neg[2:]
              trig_p.write_text(json.dumps(t, indent=2), encoding="utf-8")
          else:
              s = json.loads(scen_p.read_text(encoding="utf-8"))
              if case == "evalfew":   # canon requires >= 3 behavioral scenarios
                  s["scenarios"] = s["scenarios"][:2]
              else:                   # a scenario pointing at a fixture that isn't there
                  s["scenarios"][1]["files"] = ["test/evals/fixtures/gone.md"]
              scen_p.write_text(json.dumps(s, indent=2), encoding="utf-8")
          PY
            python3 test/plant_guard.py verify "/tmp/ev-$name" "Negative self-test (evaluation suite must stay real)"
            if out=$(python3 "/tmp/ev-$name/test/validate.py" 2>&1); then
              echo "ERROR: validator passed on eval violation '$name'"; exit 1
            fi
            if ! echo "$out" | grep -qi -- "$expect"; then
              echo "ERROR: '$name' failed for the wrong reason (no '$expect'):"
              echo "$out"; exit 1
            fi
            echo "OK: validator rejects '$name' with the right message"
          done

      - name: Negative self-test (host-capability rules must fail)
        run: |
          set -eu
          # Everything here is Claude-Code-only and invisible until a user hits it.
          for case in nodegrade:'Degradation' hookpath:'CLAUDE_PLUGIN_ROOT' \
                      hookexec:'executable' agentkey:'rejected' \
                      rootTemplates:'reaches no agent'; do
            name="${case%%:*}"; expect="${case#*:}"
            rm -rf "/tmp/hc-$name"
            cp -R . "/tmp/hc-$name"
            python3 test/plant_guard.py snap "/tmp/hc-$name"
            CASE="$name" python3 - <<'PY'
          import json, os, pathlib, re
          case = os.environ["CASE"]
          root = pathlib.Path(f"/tmp/hc-{case}")
          if case == "nodegrade":     # the fallback contract deleted from the body
              p = root / "plugins/make-skill/skills/make-skill/SKILL.md"
              p.write_text(p.read_text(encoding="utf-8").replace(
                  "### Degradation contract", "### Notes", 1), encoding="utf-8")
          elif case == "hookpath":    # a hook command that will not survive an update
              p = root / "plugins/make-skill/hooks/hooks.json"
              d = json.loads(p.read_text(encoding="utf-8"))
              d["hooks"]["PostToolUse"][0]["hooks"][0]["command"] = "\"./hooks/skill-md-audit.sh\""
              p.write_text(json.dumps(d, indent=2), encoding="utf-8")
          elif case == "hookexec":    # the hook script without its executable bit
              (root / "plugins/make-skill/hooks/skill-md-audit.sh").chmod(0o644)
          elif case == "agentkey":    # a key Claude Code rejects for plugin agents
              p = root / "plugins/make-skill/agents/skill-auditor.md"
              p.write_text(p.read_text(encoding="utf-8").replace(
                  "tools: Read", "permissionMode: acceptEdits\ntools: Read", 1), encoding="utf-8")
          else:                       # skeletons back at the repo root, reaching nobody
              (root / "templates").mkdir(exist_ok=True)
              (root / "templates/SKILL.template.md").write_text("---\nname: x\ndescription: y\n---\n")
          PY
            python3 test/plant_guard.py verify "/tmp/hc-$name" "Negative self-test (host-capability rules must fail)"
            if out=$(python3 "/tmp/hc-$name/test/validate.py" 2>&1); then
              echo "ERROR: validator passed host-capability violation '$name'"; exit 1
            fi
            if ! echo "$out" | grep -qi -- "$expect"; then
              echo "ERROR: '$name' failed for the wrong reason (no '$expect'):"; echo "$out"; exit 1
            fi
            echo "OK: validator rejects '$name' with the right message"
          done

      - name: Negative self-test (Claude Code manifest violations must fail)
        run: |
          set -eu
          for case in mktfield mktschema plgschema srcpath buried dupcmd plgdisplay mktdisplay; do
            rm -rf "/tmp/cc-$case"
            cp -R . "/tmp/cc-$case"
            python3 test/plant_guard.py snap "/tmp/cc-$case"
            CASE="$case" python3 - <<'PY'
          import json, os, pathlib
          case = os.environ["CASE"]
          root = pathlib.Path(f"/tmp/cc-{case}")
          mkt_p = root / ".claude-plugin/marketplace.json"
          plg_p = root / "plugins/make-skill/.claude-plugin/plugin.json"
          mkt = json.loads(mkt_p.read_text(encoding="utf-8"))
          plg = json.loads(plg_p.read_text(encoding="utf-8"))
          if case == "mktfield":    # plugin-entry field used at marketplace level
              mkt["homepage"] = "https://example.com"
          elif case == "mktschema":  # $schema dropped from the marketplace manifest
              mkt.pop("$schema", None)
          elif case == "plgschema":  # $schema dropped from the plugin manifest
              plg.pop("$schema", None)
          elif case == "srcpath":    # source must start with "./"
              mkt["plugins"][0]["source"] = "plugins/make-skill"
          elif case == "buried":     # components inside .claude-plugin/ load as nothing
              d = root / "plugins/make-skill/.claude-plugin/commands"
              d.mkdir(parents=True, exist_ok=True)
              (d / "buried.md").write_text("---\ndescription: x\n---\n")
          elif case == "dupcmd":     # commands/<x>.md + skills/<x>/ = /<x> registered twice
              d = root / "plugins/make-skill/commands"
              d.mkdir(parents=True, exist_ok=True)
              (d / "make-skill.md").write_text("---\ndescription: x\n---\nbody\n")
          elif case == "plgdisplay":  # the UI label the canon requires in the manifest
              plg.pop("displayName", None)
          elif case == "mktdisplay":  # ...and in the marketplace entry
              mkt["plugins"][0].pop("displayName", None)
          mkt_p.write_text(json.dumps(mkt, indent=2) + "\n", encoding="utf-8")
          plg_p.write_text(json.dumps(plg, indent=2) + "\n", encoding="utf-8")
          PY
            python3 test/plant_guard.py verify "/tmp/cc-$case" "Negative self-test (Claude Code manifest violations must fail)"
            if python3 "/tmp/cc-$case/test/validate.py"; then
              echo "ERROR: validator passed on Claude Code violation '$case'"; exit 1
            fi
            echo "OK: validator rejects Claude Code violation '$case'"
          done

      - name: Negative self-test (claims, budgets and runnable commands)
        run: |
          set -eu
          # Everything here shipped at least once and was invisible to every rule
          # that existed at the time: a count typed into prose, a card pinned two
          # releases back, a reference the README never learned about, a path
          # variable in a command that cannot run, and a Cursor rule prescribing a
          # layout this validator rejects.
          for case in claim:'claims' cardver:'SKILL-CARD' readmeref:'README' \
                      bodyvar:'substituted' cmdvar:'cannot run' mdclayout:'templates' \
                      headroom:'headroom' deschead:'working limit' xmldrift:'XML_TAG_RE'; do
            name="${case%%:*}"; expect="${case#*:}"
            rm -rf "/tmp/cl-$name"
            cp -R . "/tmp/cl-$name"
            python3 test/plant_guard.py snap "/tmp/cl-$name"
            CASE="$name" python3 - <<'PY'
          import os, pathlib, re
          case = os.environ["CASE"]
          root = pathlib.Path(f"/tmp/cl-{case}")
          skill = root / "plugins/make-skill/skills/make-skill/SKILL.md"
          if case == "claim":        # a counted claim that no longer matches its artifact
              p = root / "README.md"
              p.write_text(p.read_text(encoding="utf-8").replace("14-item", "13-item", 1),
                           encoding="utf-8")
          elif case == "cardver":    # the reviewer's card pinned to an older release
              p = root / "SKILL-CARD.md"
              p.write_text(re.sub(r"(\*\*Version\*\*\s*\|\s*)[0-9][^\s|]*", r"\g<1>0.0.1",
                                  p.read_text(encoding="utf-8"), count=1), encoding="utf-8")
          elif case == "readmeref":  # a shipped reference the README never mentions
              (root / "plugins/make-skill/skills/make-skill/references/newthing.md").write_text(
                  "# newthing\n\n**Load this when:** never.\n")
              skill.write_text(skill.read_text(encoding="utf-8")
                               + "\nSee `references/newthing.md` when nothing.\n", encoding="utf-8")
          elif case == "bodyvar":    # a path variable in the body renders as a path
              skill.write_text(skill.read_text(encoding="utf-8")
                               + "\nHooks and ${CLAUDE_PLUGIN_ROOT} live in Claude Code.\n",
                               encoding="utf-8")
          elif case == "cmdvar":     # a command the agent cannot actually run
              p = root / "plugins/make-skill/commands/skill-audit.md"
              p.write_text(p.read_text(encoding="utf-8").replace(
                  "make-skill-audit <skill-dir> --house",
                  'python3 "${CLAUDE_PLUGIN_ROOT}/skills/make-skill/scripts/audit_skill.py" x',
                  1), encoding="utf-8")
          elif case == "mdclayout":  # the Cursor rule teaching a rejected layout
              p = root / "cursor/rules/make-skill.mdc"
              p.write_text(p.read_text(encoding="utf-8").replace(
                  "cursor/rules/*.mdc ", "templates/*.md\ncursor/rules/*.mdc ", 1),
                  encoding="utf-8")
          elif case == "headroom":   # inside the 5000 ceiling, past the working limit
              t = skill.read_text(encoding="utf-8")
              body = re.sub(r"^---\n.*?\n---\n", "", t, count=1, flags=re.S)
              need = int(4750 * 3.9) - len(body) + 40
              skill.write_text(t + "\n" + ("p" * max(need, 40)) + "\n", encoding="utf-8")
          elif case == "deschead":   # description inside the 1024 cap, past its own limit
              t = skill.read_text(encoding="utf-8")
              d = re.search(r"^description: (.+?)(?=\nlicense:)", t, re.S | re.M).group(1)
              pad = " padding phrase." * 6                      # lands between 970 and 1024
              skill.write_text(t.replace(d, (d + pad)[:1000], 1), encoding="utf-8")
          else:                      # the two validators disagreeing on one rule
              p = root / "plugins/make-skill/skills/make-skill/scripts/audit_skill.py"
              p.write_text(re.sub(r'^XML_TAG_RE = re\.compile\(r".+"\)$',
                                  'XML_TAG_RE = re.compile(r"<different>")',
                                  p.read_text(encoding="utf-8"), count=1, flags=re.M),
                           encoding="utf-8")
          PY
            python3 test/plant_guard.py verify "/tmp/cl-$name" "Negative self-test (claims, budgets and runnable commands)"
            if out=$(python3 "/tmp/cl-$name/test/validate.py" 2>&1); then
              echo "ERROR: validator passed claim/command violation '$name'"; exit 1
            fi
            if ! echo "$out" | grep -qi -- "$expect"; then
              echo "ERROR: '$name' failed for the wrong reason (no '$expect'):"; echo "$out"; exit 1
            fi
            echo "OK: validator rejects '$name' with the right message"
          done

      - name: Bundled auditor (clean on its own skill, finds every planted defect)
        run: |
          set -eu
          S=plugins/make-skill/skills/make-skill
          # 1. the skill that ships the auditor must pass it, house rules included —
          #    through the bin/ wrapper, which is the invocation the docs promise
          ./plugins/make-skill/bin/make-skill-audit "$S" --house
          # 2. the evaluation fixture, materialised as a skill directory, must fail
          #    with every one of its nine planted defects named
          rm -rf /tmp/aud && mkdir -p /tmp/aud/invoices
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("test/evals/fixtures/retrofit-input.md").read_text(encoding="utf-8")
          pathlib.Path("/tmp/aud/invoices/SKILL.md").write_text(
              re.sub(r"^<!--.*?-->\s*", "", src, count=1, flags=re.S), encoding="utf-8")
          PY
          if out=$(python3 "$S/scripts/audit_skill.py" /tmp/aud/invoices --house --json); then
            echo "ERROR: auditor passed a fixture with nine planted defects"; exit 1
          fi
          for id in NAME_RESERVED NAME_DIR DESC_PERSON DESC_XML FM_UNKNOWN_KEY \
                    REF_NO_TRIGGER LINK_ESCAPE WIN_PATH TIME_BRANCH; do
            echo "$out" | grep -q "\"$id\"" || { echo "auditor missed $id"; exit 1; }
          done
          # 3. the house headroom rule must fire on a description that is legal upstream
          #    but has no room left for a "NOT for …" clause
          rm -rf /tmp/aud/wide && mkdir -p /tmp/aud/wide
          python3 - <<'PY'
          import pathlib
          d = "Use when doing a thing - \"сделай\". " + "padding phrase. " * 60
          pathlib.Path("/tmp/aud/wide/SKILL.md").write_text(
              f"---\nname: wide\ndescription: {d[:1000]}\n---\n\n# Wide\n", encoding="utf-8")
          PY
          if python3 "$S/scripts/audit_skill.py" /tmp/aud/wide --house --json | grep -q DESC_HEADROOM; then
            echo "OK: auditor flags a description with no headroom"
          else
            echo "ERROR: auditor missed DESC_HEADROOM"; exit 1
          fi
          echo "OK: auditor clean on its own skill, nine defects found on the fixture"

      - name: Hook is silent unless a SKILL.md was written
        run: |
          set -eu
          export CLAUDE_PLUGIN_ROOT="$PWD/plugins/make-skill"
          H="$CLAUDE_PLUGIN_ROOT/hooks/skill-md-audit.sh"
          # not a SKILL.md → no output at all. A globally installed plugin must be
          # invisible in projects that do not author skills.
          out=$(echo '{"tool_name":"Write","tool_input":{"file_path":"/tmp/aud/notes.md"}}' | "$H")
          test -z "$out" || { echo "ERROR: hook spoke about a non-SKILL.md write: $out"; exit 1; }
          # a broken SKILL.md → advice, still exit 0 (PostToolUse must not block)
          out=$(echo '{"tool_name":"Write","tool_input":{"file_path":"/tmp/aud/invoices/SKILL.md"}}' | "$H")
          echo "$out" | grep -q '"systemMessage"' || { echo "ERROR: hook stayed silent on a broken SKILL.md"; exit 1; }
          # a clean SKILL.md → silent again
          out=$(echo "{\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"$PWD/plugins/make-skill/skills/make-skill/SKILL.md\"}}" | "$H")
          test -z "$out" || { echo "ERROR: hook complained about a clean SKILL.md: $out"; exit 1; }
          echo "OK: hook no-ops, advises, and never blocks"

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: npm installer CLI check
        run: |
          set -eu
          node --check bin/make-skill.js
          # --version must print the package version, nothing else
          test "$(node bin/make-skill.js --version)" = "$(node -p "require('./package.json').version")"
          node bin/make-skill.js --help | grep -q -- '--force'

      - name: npm installer functional test (fresh / rerun-skip / --force)
        run: |
          set -eu
          # Start from an empty HOME. On a CI runner it always is; on a developer
          # machine running this suite locally (CONTRIBUTING promises that works)
          # a previous run's copy is still there, and "fresh install" silently
          # becomes "rerun-skip".
          export HOME=/tmp/fakehome
          rm -rf "$HOME"
          mkdir -p "$HOME"
          node bin/make-skill.js
          test -f "$HOME/.claude/skills/make-skill/SKILL.md"
          # no ~/.claude/commands/make-skill.md: a command sharing the skill's
          # name registers /make-skill twice (see `claude plugin details`)
          test ! -e "$HOME/.claude/commands/make-skill.md"
          # references must travel with the skill — relative links break otherwise
          for r in agent-skills-spec authoring surfaces enterprise retrofit host-capabilities claude-code-plugin distribution mcp a2a; do
            test -f "$HOME/.claude/skills/make-skill/references/$r.md"
          done
          # scripts and skeletons must travel too — they are the half that works
          # on agents with no hooks, no subagents and no /commands
          test -x "$HOME/.claude/skills/make-skill/scripts/audit_skill.py"
          for t in SKILL.template.md plugin.template.json marketplace.template.json \
                   hooks.template.json agent.template.md command.template.md; do
            test -f "$HOME/.claude/skills/make-skill/assets/$t"
          done
          node bin/make-skill.js | grep -q '^skip:'
          node bin/make-skill.js --force | grep -q '^Installed'
          if node bin/make-skill.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          # One channel per agent: with the plugin present, a plain copy would
          # shadow it and the stale copy wins. Both installers must refuse.
          mkdir -p "$HOME/.claude/plugins/marketplaces/make-skill"
          rm -rf "$HOME/.claude/skills/make-skill"
          node bin/make-skill.js | grep -q 'already installed as a Claude Code plugin'
          test ! -e "$HOME/.claude/skills/make-skill"
          ./install.sh | grep -q 'already installed as a Claude Code plugin'
          test ! -e "$HOME/.claude/skills/make-skill"
          node bin/make-skill.js --force | grep -q '^Installed'
          rm -rf "$HOME/.claude/plugins/marketplaces"
          echo "OK: npm installer behaves, and neither installer creates a shadow"

      - name: Workflow YAML parses (validate + release)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/release.yml')); yaml.safe_load(open('.github/workflows/validate.yml')); print('workflows parse OK')"

  # Anthropic's own checker, in its own job: an upstream CLI outage must not be
  # able to mask a house-validator failure. `plugin validate` is offline and
  # needs no auth.
  claude-plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate (plugin + marketplace, --strict)
        run: |
          set -eu
          claude --version
          claude plugin validate ./plugins/make-skill --strict
          claude plugin validate . --strict
